<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Criador e Rastreador de Partitura</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #ffffff;
            font-family: 'Segoe UI', Tahoma, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            margin: 0;
        }
        h1 { color: #4CAF50; margin-bottom: 5px; }
        .painel-criacao {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            margin-bottom: 20px;
            width: 90%;
            max-width: 600px;
            text-align: center;
        }
        input[type="text"] {
            width: 80%;
            padding: 10px;
            font-size: 18px;
            border-radius: 8px;
            border: 2px solid #4CAF50;
            background: #333;
            color: white;
            margin-bottom: 10px;
        }
        .botoes-acao button {
            padding: 10px 20px;
            font-size: 16px;
            margin: 5px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: 0.2s;
            font-weight: bold;
        }
        .btn-ouvir { background-color: #2196F3; color: white; }
        .btn-ouvir:hover { background-color: #1976D2; }
        .btn-tocar { background-color: #4CAF50; color: white; }
        .btn-tocar:hover { background-color: #45a049; }
        
        .nota-alvo-container {
            padding: 30px;
            border: 4px solid #4CAF50;
            border-radius: 20px;
            background: #2a2a2a;
            text-align: center;
            margin-top: 20px;
            width: 300px;
        }
        #nota-alvo { font-size: 80px; font-weight: bold; margin: 10px 0; color: #4CAF50; }
        #proximas-notas { font-size: 24px; color: #888888; letter-spacing: 3px; margin-top: 20px; }
        #mensagem { color: #ffeb3b; margin-top: 10px; }
    </style>
</head>
<body>

    <h1>Suas Notas</h1>
    <p>Digite as notas (Ex: C4 D4 E4 ou Do4 Re4 Mi4):</p>
    
    <div class="painel-criacao">
        <input type="text" id="input-notas" value="Mi4 Mi4 Fa4 Sol4 Sol4 Fa4 Mi4 Re4 Do4 Do4 Re4 Mi4" placeholder="Ex: Do4 Re4 Mi4 ou C4 D4 E4">
        <div class="botoes-acao">
            <button class="btn-ouvir" id="btn-ouvir-tudo">Ouvir o que digitei 🎵</button>
            <button class="btn-tocar" id="btn-iniciar-violao">Tocar no Violão 🎸</button>
        </div>
        <p id="mensagem"></p>
    </div>

    <div class="nota-alvo-container" style="display: none;" id="painel-notas">
        <p style="margin: 0;">Toque agora:</p>
        <p id="nota-alvo">?</p>
        <p id="nota-ouvida" style="color: #aaa;">Ouvindo: ...</p>
    </div>

    <p id="proximas-notas"></p>

<script>
    let partitura = [];
    let notaAtualIndex = 0;
    let audioContext;
    let analyser, microphone;
    let escutando = false;
    let framesAcertados = 0;

    // Dicionário que traduz o texto para o índice da nota (0 a 11)
    function traduzirNota(notaStr) {
        let n = notaStr.toLowerCase().trim();
        let oitava = 4; // Oitava padrão
        
        // Puxa o número da oitava se o jogador digitar (ex: extrai o 4 de "Do4")
        let numMatch = n.match(/\d+/);
        if (numMatch) {
            oitava = parseInt(numMatch[0]);
            n = n.replace(numMatch[0], "");
        }
        
        let indice = -1;
        if (n==="c" || n==="do" || n==="dó") indice = 0;
        else if (n==="c#" || n==="do#" || n==="dó#") indice = 1;
        else if (n==="d" || n==="re" || n==="ré") indice = 2;
        else if (n==="d#" || n==="re#" || n==="ré#") indice = 3;
        else if (n==="e" || n==="mi") indice = 4;
        else if (n==="f" || n==="fa" || n==="fá") indice = 5;
        else if (n==="f#" || n==="fa#" || n==="fá#") indice = 6;
        else if (n==="g" || n==="sol") indice = 7;
        else if (n==="g#" || n==="sol#") indice = 8;
        else if (n==="a" || n==="la" || n==="lá") indice = 9;
        else if (n==="a#" || n==="la#" || n==="lá#") indice = 10;
        else if (n==="b" || n==="si") indice = 11;
        
        if (indice === -1) return null;
        
        // Fórmula matemática para descobrir os Hertz (Hz) da nota
        let midi = (oitava + 1) * 12 + indice;
        let frequencia = 440 * Math.pow(2, (midi - 69) / 12);
        
        return { nomeFormatado: notaStr, frequencia: frequencia, indiceMidi: midi };
    }

    // Função para o aplicativo "tocar" o som da nota para o jogador ouvir
    function tocarFrequencia(freq, duracao = 0.5) {
        if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
        
        const osc = audioContext.createOscillator();
        const ganho = audioContext.createGain();
        
        osc.type = "sine"; // Som suave
        osc.frequency.value = freq;
        
        osc.connect(ganho);
        ganho.connect(audioContext.destination);
        
        osc.start();
        ganho.gain.exponentialRampToValueAtTime(0.00001, audioContext.currentTime + duracao);
        osc.stop(audioContext.currentTime + duracao);
    }

    // Botão de ouvir a sequência digitada
    document.getElementById('btn-ouvir-tudo').addEventListener('click', async () => {
        const texto = document.getElementById('input-notas').value;
        const notasDigitadas = texto.split(" ").filter(n => n.length > 0);
        
        document.getElementById('mensagem').innerText = "Tocando...";
        
        for (let i = 0; i < notasDigitadas.length; i++) {
            let dadosNota = traduzirNota(notasDigitadas[i]);
            if (dadosNota) {
                tocarFrequencia(dadosNota.frequencia, 0.4);
                // Espera meia segundo antes de tocar a próxima
                await new Promise(r => setTimeout(r, 500)); 
            }
        }
        document.getElementById('mensagem').innerText = "Pronto!";
    });

    // Função para atualizar a tela do violão
    function atualizarTela() {
        const notaAlvoEl = document.getElementById('nota-alvo');
        const proximasNotasEl = document.getElementById('proximas-notas');
        
        if (notaAtualIndex >= partitura.length) {
            notaAlvoEl.innerText = "FIM!";
            proximasNotasEl.innerText = "";
            return;
        }
        
        notaAlvoEl.innerText = partitura[notaAtualIndex];
        let proximas = partitura.slice(notaAtualIndex + 1, notaAtualIndex + 5);
        proximasNotasEl.innerText = proximas.join("  ");
    }

    // Iniciar o microfone para o violão
    document.getElementById('btn-iniciar-violao').addEventListener('click', async () => {
        // Carrega as notas do input para o array
        const texto = document.getElementById('input-notas').value;
        partitura = texto.split(" ").filter(n => n.length > 0);
        notaAtualIndex = 0;

        try {
            if (!audioContext) audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            
            analyser = audioContext.createAnalyser();
            analyser.fftSize = 2048;
            microphone = audioContext.createMediaStreamSource(stream);
            microphone.connect(analyser);
            
            escutando = true;
            document.getElementById('painel-notas').style.display = 'block';
            document.getElementById('mensagem').innerText = "";
            
            atualizarTela();
            detectarPitch();
            
        } catch (err) {
            document.getElementById('mensagem').innerText = "Libere o microfone para tocar!";
        }
    });

    function detectarPitch() {
        if (!escutando) return;
        
        const buffer = new Float32Array(analyser.fftSize);
        analyser.getFloatTimeDomainData(buffer);
        const frequencia = autoCorrelacao(buffer, audioContext.sampleRate);
        
        if (frequencia !== -1 && notaAtualIndex < partitura.length) {
            let notaNum = Math.round(12 * (Math.log(frequencia / 440) / Math.log(2))) + 69;
            
            // Pega os dados da nota que o jogador tem que tocar agora
            let dadosNotaAlvo = traduzirNota(partitura[notaAtualIndex]);
            
            if (dadosNotaAlvo) {
                // Compara se o MIDI da nota do violão bate com o MIDI da nota alvo (ignorando a diferença de oitava exata para facilitar o violão)
                if (notaNum % 12 === dadosNotaAlvo.indiceMidi % 12) {
                    framesAcertados++;
                    if (framesAcertados > 10) { 
                        notaAtualIndex++;
                        framesAcertados = 0;
                        atualizarTela();
                        document.getElementById('painel-notas').style.borderColor = "#FFeb3b";
                        setTimeout(() => document.getElementById('painel-notas').style.borderColor = "#4CAF50", 200);
                    }
                } else {
                    framesAcertados = 0;
                }
            }
        }
        requestAnimationFrame(detectarPitch);
    }

    // Algoritmo matemático para o microfone
    function autoCorrelacao(buf, sampleRate) {
        let SIZE = buf.length;
        let rms = 0;
        for (let i = 0; i < SIZE; i++) rms += buf[i] * buf[i];
        rms = Math.sqrt(rms / SIZE);
        if (rms < 0.01) return -1; 

        let r1 = 0, r2 = SIZE - 1, thres = 0.2;
        for (let i = 0; i < SIZE / 2; i++) if (Math.abs(buf[i]) < thres) { r1 = i; break; }
        for (let i = 1; i < SIZE / 2; i++) if (Math.abs(buf[SIZE - i]) < thres) { r2 = SIZE - i; break; }

        buf = buf.slice(r1, r2);
        SIZE = buf.length;
        let c = new Array(SIZE).fill(0);
        for (let i = 0; i < SIZE; i++)
            for (let j = 0; j < SIZE - i; j++)
                c[i] = c[i] + buf[j] * buf[j + i];

        let d = 0; while (c[d] > c[d + 1]) d++;
        let maxval = -1, maxpos = -1;
        for (let i = d; i < SIZE; i++) {
            if (c[i] > maxval) { maxval = c[i]; maxpos = i; }
        }
        let T0 = maxpos;
        return sampleRate / T0;
    }
</script>

</body>
    </html>
