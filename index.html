<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berimbau Notation Studio 5.1 Pro</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e2e; --accent: #ff9f43; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; margin: 0; height: 100vh; overflow: hidden; }
        
        /* Área de Edição com Rolagem Horizontal Infinita */
        #editor-container { flex: 1; padding: 15px; overflow-x: auto; overflow-y: hidden; background: #080808; display: flex; align-items: center; white-space: nowrap; }
        #toolbar { background: var(--panel); padding: 15px; overflow-y: auto; max-height: 45vh; border-top: 2px solid #333; box-sizing: border-box; }
        
        /* Wrapper da Folha de Partitura */
        .sheet-wrapper { background: #fff; color: #000; padding: 30px 20px 40px 20px; border-radius: 8px; position: relative; display: inline-flex; flex-direction: column; box-shadow: 0 4px 10px rgba(0,0,0,0.5); min-height: 240px; vertical-align: middle; }
        .sheet-header { display: flex; gap: 30px; font-weight: bold; margin-bottom: 20px; font-size: 14px; border-bottom: 2px solid #ccc; padding-bottom: 5px; }
        
        /* Estrutura da Pauta (Aumentada para 140px para acomodar as notas perfeitamente) */
        .pauta-area { position: relative; height: 140px; display: inline-flex; align-items: center; padding-left: 90px; }
        .stave-lines { position: absolute; left: 90px; right: 0; height: 60px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1; }
        .line { height: 2px; background: #000; }
        
        .cabaca-container { position: absolute; left: 10px; top: 20px; width: 55px; height: 85px; z-index: 2; }
        
        /* Legenda Numérica Alinhada Perfeitamente com os Centros das Notas */
        .legend-num { position: absolute; left: 70px; top: 0; height: 140px; font-weight: bold; font-size: 13px; z-index: 2; color: #000; }
        .legend-num span { position: absolute; transform: translateY(-50%); left: 0; }
        
        /* Trilho de Notas */
        .notes-track { display: flex; align-items: flex-start; z-index: 3; height: 100%; position: relative; }
        .note-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 50px; height: 140px; }
        .note-wrapper:hover { background: rgba(0,0,0,0.05); }
        .note-svg { width: 50px; height: 140px; overflow: visible; }
        
        /* Linhas e Marcas de Força (Volumes 1-6) */
        .volume-indicator { position: absolute; bottom: 5px; font-weight: bold; font-size: 13px; color: #000; background: #fff; border: 1px solid #ccc; border-radius: 3px; padding: 1px 4px; z-index: 5; cursor: pointer;}
        .volume-indicator:hover { background: #f0f0f0; }
        .volume-line { position: absolute; bottom: 12px; height: 2px; background: #999; width: 50px; z-index: 1; }
        .abafado-mark { position: absolute; font-weight: bold; color: #d32f2f; font-size: 13px; transform: translate(-50%, -50%); left: 18px; }
        
        /* Divisores de Compasso Alinhados com as 3 Linhas (Altura 60px, Topo 40px) */
        .bar-line { width: 2px; background: #000; height: 60px; margin-top: 40px; margin-left: 10px; margin-right: 10px; display: inline-block; position: relative; z-index: 2;}
        .final-bar-line { width: 7px; border-left: 2px solid #000; border-right: 4px solid #000; height: 60px; margin-top: 40px; margin-left: 10px; margin-right: 10px; display: inline-block; z-index: 2; box-sizing: border-box;}
        
        /* Elementos de Interface do Painel */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .grid-5 { display: grid; grid-template-columns: repeat(5, 1fr); gap: 4px; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 8px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 13px; }
        .btn.active { background: var(--accent); color: black; border-color: var(--accent); }
        .btn-play { background: #4caf50; color: white; border: none; padding: 12px; font-size: 15px; width: 100%; margin-bottom: 10px; font-weight: bold; border-radius: 5px; }
        .btn-action { background: #007bff; color: white; border: none; padding: 8px; width: 100%; margin-top: 4px; border-radius: 4px; font-weight: bold; }
        
        select { padding: 6px; background: #222; color: #fff; border: 1px solid #444; width: 100%; border-radius: 4px; }
        .config-box { background: #2a2a35; padding: 10px; border-radius: 5px; margin-bottom: 8px; }
        label { font-size: 0.8em; color: #aaa; display: block; margin-bottom: 4px; }
        
        /* Área de Exportação de Foto */
        #export-stave-render { background: #fff; color: #000; padding: 30px; display: none; width: 800px; }
        .export-row { position: relative; height: 160px; margin-bottom: 40px; display: flex; align-items: center; border-bottom: 1px dashed #ccc; }
        .export-legend-block { font-size: 12px; font-family: monospace; line-height: 1.4; background: #f5f5f5; padding: 10px; border: 1px solid #ddd; margin-top: 20px; }
    </style>
</head>
<body>

<svg width="0" height="0" style="display:none;">
    <defs>
        <pattern id="pat-chiado" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="3" height="6" fill="black" />
            <rect x="3" width="3" height="6" fill="white" />
        </pattern>
        <linearGradient id="pat-soltachiado" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="50%" stop-color="white"/>
            <stop offset="50%" stop-color="black"/>
        </linearGradient>
    </defs>
</svg>

<div id="editor-container">
    <div class="sheet-wrapper" id="view-sheet-wrapper">
        <div class="sheet-header">
            <span>Ritmo: Berimbau Studio</span>
            <span>Compasso: 4/4</span>
        </div>
        
        <div class="pauta-area">
            <div class="legend-num">
                <span style="top: 55px;">5</span>
                <span style="top: 70px;">4</span>
                <span style="top: 85px;">3</span>
                <span style="top: 100px;">2</span>
                <span style="top: 115px;">1</span>
            </div>
            <div class="cabaca-container" id="view-cabaca"></div>
            
            <div class="stave-lines" id="view-stave-lines" style="top: 40px;">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            
            <div class="notes-track" id="view-notas"></div>
        </div>
    </div>
</div>

<div id="export-stave-render"></div>

<div id="toolbar">
    <button class="btn-play" onclick="tocarPartitura()">▶ TOCAR COMPOSIÇÃO (Polifônico)</button>

    <div class="config-box">
        <div class="grid-2">
            <div>
                <label>Velocidade (BPM)</label>
                <input type="number" id="input-bpm" value="120" style="width: 100%; padding: 8px; border-radius: 5px; border: 1px solid #444; background: #222; color: white; font-weight: bold; margin-bottom: 10px; box-sizing: border-box; text-align: center;">

                <label>Duração da Nota (Mais Longa para Mais Curta)</label>
                <div class="grid-2" id="btn-valores" style="grid-template-columns: 1fr;">
                    <button class="btn" onclick="setValor(4, false, this)">Semibreve (4 tempos)</button>
                    <button class="btn" onclick="setValor(2, false, this)">Mínima (2 tempos)</button>
                    <button class="btn active" onclick="setValor(1, false, this)">Semínima (1 tempo)</button>
                    <button class="btn" onclick="setValor(0.5, false, this)">Colcheia (1/2 tempo)</button>
                    <button class="btn" onclick="setValor(0.25, false, this)">Semicolcheia (1/4 tempo)</button>
                    <button class="btn" onclick="setValor(0.125, false, this)">Fusa (1/8 tempo)</button>
                    <button class="btn" onclick="setValor(1, true, this)">Pausa (/)</button>
                </div>
            </div>
            <div>
                <label>Modificadores (Acumulativos)</label>
                <button class="btn" id="btn-abafado" style="width:100%; margin-bottom:4px; background:#444;" onclick="toggleAbafado()">Abafado (X): DESLIGADO</button>
                <button class="btn" id="btn-opcional" style="width:100%; margin-bottom:4px; background:#444;" onclick="toggleOpcional()">Opcional ( ): DESLIGADO</button>
                <button class="btn" id="btn-pontuado" style="width:100%; margin-bottom:8px; background:#444;" onclick="togglePontuado()">Pontuado (.): DESLIGADO</button>
                
                <label>Adicionar Força Dinâmica (1-6)</label>
                <div class="grid-5">
                    <button class="btn btn-f" onclick="setForcaMarcador(1, this)">1</button>
                    <button class="btn btn-f" onclick="setForcaMarcador(2, this)">2</button>
                    <button class="btn btn-f active" onclick="setForcaMarcador(3, this)">3</button>
                    <button class="btn btn-f" onclick="setForcaMarcador(4, this)">4</button>
                    <button class="btn btn-f" onclick="setForcaMarcador(5, this)">5</button>
                    <button class="btn btn-f" onclick="setForcaMarcador(6, this)">6</button>
                </div>
            </div>
        </div>
    </div>

    <div class="config-box">
        <label>Clique para inserir na pauta (Onde escolheu abaixo):</label>
        <div class="grid-5">
            <button class="btn" style="background:#000;" onclick="addNota('presa')">Presa</button>
            <button class="btn" style="background:#fff; color:#000;" onclick="addNota('solta')">Solta</button>
            <button class="btn" style="background:gray;" onclick="addNota('chiado')">Chiado</button>
            <button class="btn" style="background:#333;" onclick="addNota('acaxixi')">Caxixi</button>
            <button class="btn" style="background:linear-gradient(90deg, #fff 50%, #000 50%); color:red;" onclick="addNota('soltachiado')">S+C</button>
        </div>
    </div>

    <div class="config-box">
        <label>Mapeamento das Linhas/Espaços (Conforme o Desenho de 5 alturas)</label>
        <div class="grid-5">
            <div><label>Pos 5 (Espaço Alto)</label><select id="map-5"><option value="chiado" selected>Chiado</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="acaxixi">Caxixi</option><option value="soltachiado">S+C</option></select></div>
            <div><label>Pos 4 (Linha Meio)</label><select id="map-4"><option value="soltachiado" selected>S+C</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="acaxixi">Caxixi</option></select></div>
            <div><label>Pos 3 (Espaço Baixo)</label><select id="map-3"><option value="solta" selected>Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="acaxixi">Caxixi</option><option value="soltachiado">S+C</option></select></div>
            <div><label>Pos 2 (Linha Baixo)</label><select id="map-2"><option value="acaxixi" selected>Caxixi</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="soltachiado">S+C</option></select></div>
            <div><label>Pos 1 (Abaixo da L1)</label><select id="map-1"><option value="presa" selected>Presa</option><option value="solta">Solta</option><option value="chiado">Chiado</option><option value="acaxixi">Caxixi</option><option value="soltachiado">S+C</option></select></div>
        </div>
    </div>

    <div class="grid-2">
        <button class="btn-action" style="background:#28a745;" onclick="salvarPartitura()">💾 Salvar Composição</button>
        <button class="btn-action" style="background:#17a2b8;" onclick="carregarPartitura()">📂 Carregar Antiga</button>
        <button class="btn-action" style="background:#e056fd; grid-column: span 2;" onclick="baixarImagemOtimizada()">📸 Baixar como Imagem (Quebra de Linhas + Legenda)</button>
        <button class="btn-action" style="background:#6c757d; grid-column: span 2;" onclick="limparTudo()">🗑 Limpar Tudo</button>
    </div>
</div>

<script>
    let partitura = [];
    let valorAtual = 1;
    let isPausa = false;
    let abafadoAtivo = false;
    let opcionalAtivo = false;
    let pontuadoAtivo = false;
    let forcaMarcadorAtual = 3;
    let somPool = []; 

    function renderCabaça(targetId) {
        document.getElementById(targetId).innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="42" fill="white" stroke="black" stroke-width="5"/><path d="M50,50 L8,50 A42,42 0 1,1 50,92 Z" fill="black"/></svg>`;
    }

    function setValor(val, pausa, btnRef) {
        isPausa = pausa;
        valorAtual = parseFloat(val);
        document.querySelectorAll('#btn-valores .btn').forEach(b => b.classList.remove('active'));
        btnRef.classList.add('active');
    }

    function toggleAbafado() {
        abafadoAtivo = !abafadoAtivo;
        const btn = document.getElementById('btn-abafado');
        if(abafadoAtivo) { btn.innerText = "Abafado (X): LIGADO"; btn.style.background = "#d32f2f"; }
        else { btn.innerText = "Abafado (X): DESLIGADO"; btn.style.background = "#444"; }
    }

    function toggleOpcional() {
        opcionalAtivo = !opcionalAtivo;
        const btn = document.getElementById('btn-opcional');
        if(opcionalAtivo) { btn.innerText = "Opcional ( ): LIGADO"; btn.style.background = "#007bff"; }
        else { btn.innerText = "Opcional ( ): DESLIGADO"; btn.style.background = "#444"; }
    }

    function togglePontuado() {
        pontuadoAtivo = !pontuadoAtivo;
        const btn = document.getElementById('btn-pontuado');
        if(pontuadoAtivo) { btn.innerText = "Pontuado (.): LIGADO"; btn.style.background = "#9b59b6"; }
        else { btn.innerText = "Pontuado (.): DESLIGADO"; btn.style.background = "#444"; }
    }

    function setForcaMarcador(num, btnRef) {
        forcaMarcadorAtual = num;
        document.querySelectorAll('.btn-f').forEach(b => b.classList.remove('active'));
        btnRef.classList.add('active');
    }

    function getPosicaoByTecnica(tecnica) {
        for(let i=1; i<=5; i++) {
            if(document.getElementById(`map-${i}`).value === tecnica) return i;
        }
        return 3;
    }

    function addNota(tecnica) {
        let exigeNumeroMarcador = false;
        if(partitura.length === 0 || partitura[partitura.length-1].forcaOriginal !== forcaMarcadorAtual) {
            exigeNumeroMarcador = true;
        }

        partitura.push({
            id: Date.now(),
            tecnica: tecnica,
            valor: valorAtual,
            linhaPos: getPosicaoByTecnica(tecnica),
            isPausa: isPausa,
            abafado: abafadoAtivo,
            opcional: opcionalAtivo,
            pontuado: pontuadoAtivo,
            forcaOriginal: forcaMarcadorAtual,
            mostraNumero: exigeNumeroMarcador
        });

        renderizar();
        
        setTimeout(() => {
            const container = document.getElementById('editor-container');
            container.scrollLeft = container.scrollWidth;
        }, 50);
    }

    function removerNota(id) {
        if(confirm("Deseja apagar esta nota?")) {
            partitura = partitura.filter(n => n.id !== id);
            recalcularMarcadoresForca();
            renderizar();
        }
    }

    function editarForcaNota(id) {
        const novaForca = prompt("Digite a nova força (1 a 6):", "3");
        const numForca = parseInt(novaForca);
        
        if (numForca >= 1 && numForca <= 6) {
            for(let i=0; i<partitura.length; i++) {
                if(partitura[i].id === id) {
                    partitura[i].forcaOriginal = numForca;
                    break;
                }
            }
            recalcularMarcadoresForca();
            renderizar();
        } else if (novaForca !== null) {
            alert("Força inválida! Use um número de 1 a 6.");
        }
    }

    function recalcularMarcadoresForca() {
        for(let i=0; i<partitura.length; i++) {
            if(i===0) partitura[i].mostraNumero = true;
            else partitura[i].mostraNumero = (partitura[i].forcaOriginal !== partitura[i-1].forcaOriginal);
        }
    }

    // CORRIGIDO: Coordenadas exatas das 5 alturas baseadas no seu desenho de 3 linhas!
    function getTargetCy(linhaPos) {
        if (linhaPos === 5) return 40;  // Espaço de cima
        if (linhaPos === 4) return 55;  // Linha do meio
        if (linhaPos === 3) return 70;  // Espaço de baixo
        if (linhaPos === 2) return 85; // Linha de baixo
        if (linhaPos === 1) return 100; // Espaço totalmente abaixo da pauta
        return 115;
    }

    function criarElementoNota(n, index, arr, exportView) {
        let fill = "white";
        if(n.tecnica === 'presa') fill = "black";
        if(n.tecnica === 'chiado') fill = "url(#pat-chiado)";
        if(n.tecnica === 'soltachiado') fill = "url(#pat-soltachiado)";

        const targetCy = getTargetCy(n.linhaPos);
        let innerSVG = '';
        
        // Verifica conexão automática de traço (beam) para colcheias/menores
        let hasBeam = false;
        if (n.valor <= 0.5 && index < arr.length - 1 && arr[index+1].valor <= 0.5 && !arr[index+1].isPausa) {
            hasBeam = true;
        }
        
        if (n.isPausa) {
            // Pausa centralizada na pauta
            innerSVG = `<text x="14" y="80" font-size="38" fill="#d32f2f" font-weight="bold">/</text>`;
        } else {
            // Desenho perfeito do formato oval da cabeça da nota
            if(n.valor === 4) { 
                innerSVG += `<ellipse cx="18" cy="${targetCy}" rx="11" ry="8" fill="white" stroke="black" stroke-width="3"/>`;
            } else { 
                innerSVG += `<ellipse cx="18" cy="${targetCy}" rx="9" ry="6" fill="${fill}" stroke="black" stroke-width="2"/>`;
            }

            if (n.tecnica === 'acaxixi') innerSVG += `<circle cx="18" cy="${targetCy}" r="3" fill="black"/>`;

            // Desenho da Haste (Semibreve não tem)
            if (n.valor < 4) {
                let stemTop = targetCy - 45;
                if (hasBeam) stemTop = 30; // Alinha haste perfeitamente com a barra conectora fixa
                innerSVG += `<line x1="27" y1="${targetCy}" x2="27" y2="${stemTop}" stroke="black" stroke-width="2"/>`;
            }

            // Barra conectora superior (Beams)
            if (hasBeam) {
                innerSVG += `<rect x="27" y="30" width="50" height="4" fill="black" />`;
            } else {
                // Colchetes normais caso a nota esteja isolada
                let stemTop = targetCy - 45;
                if (n.valor <= 0.5) innerSVG += `<path d="M27,${stemTop} Q37,${stemTop+10} 37,${stemTop+23}" fill="none" stroke="black" stroke-width="2"/>`;
                if (n.valor <= 0.25) innerSVG += `<path d="M27,${stemTop+8} Q37,${stemTop+18} 37,${stemTop+31}" fill="none" stroke="black" stroke-width="2"/>`;
                if (n.valor <= 0.125) innerSVG += `<path d="M27,${stemTop+16} Q37,${stemTop+26} 37,${stemTop+39}" fill="none" stroke="black" stroke-width="2"/>`;
            }
        }

        // Modificador de Ponto de aumento (.)
        if(n.pontuado) {
            innerSVG += `<circle cx="${n.isPausa ? 28 : 34}" cy="${n.isPausa ? 65 : targetCy}" r="2.5" fill="black"/>`;
        }

            // Modificador Opcional ()
        if(n.opcional) {
            innerSVG += `<text x="1" y="${targetCy + 7}" font-size="20" font-family="sans-serif" font-weight="bold" fill="black">(</text>`;
            innerSVG += `<text x="37" y="${targetCy + 7}" font-size="20" font-family="sans-serif" font-weight="bold" fill="black">)</text>`;
        }

        const div = document.createElement('div');
        div.className = 'note-wrapper';
        
        if(!exportView) {
            div.onclick = (e) => {
                if(e.target.className === 'volume-indicator') return;
                removerNota(n.id);
            };
        }
        
        let htmlExtra = `<svg class="note-svg">${innerSVG}</svg>`;
        
        // Modificador Abafado (X) centralizado em cima da cabeça da nota
        if(n.abafado && !n.isPausa) {
            htmlExtra += `<span class="abafado-mark" style="top: ${targetCy}px;">X</span>`;
        }

        if(n.mostraNumero) {
            htmlExtra += `<span class="volume-indicator" ${!exportView ? `onclick="editarForcaNota(${n.id})"` : ''}>${n.forcaOriginal}</span>`;
        } else {
            htmlExtra += `<div class="volume-line"></div>`;
        }

        div.innerHTML = htmlExtra;
        return div;
    }

    function renderizar() {
        const container = document.getElementById('view-notas');
        container.innerHTML = '';
        
        let somaCompasso = 0;
        const maxCompasso = 4;

        for(let i = 0; i < partitura.length; i++) {
            const n = partitura[i];
            const divNota = criarElementoNota(n, i, partitura, false);
            container.appendChild(divNota);

            const valorReal = n.pontuado ? n.valor * 1.5 : n.valor;
            somaCompasso += valorReal;

            if(somaCompasso >= maxCompasso && i !== partitura.length - 1) {
                const bar = document.createElement('div');
                bar.className = 'bar-line';
                container.appendChild(bar);
                somaCompasso = 0;
            }
        }

        if(partitura.length > 0) {
            const endBar = document.createElement('div');
            endBar.className = 'final-bar-line';
            container.appendChild(endBar);
        }

        const larguraTrilho = container.offsetWidth + 200;
        document.getElementById('view-stave-lines').style.width = `${larguraTrilho}px`;
        document.getElementById('view-sheet-wrapper').style.width = `${larguraTrilho}px`;
        renderCabaça('view-cabaca');
    }

    function tocarAudioPolifonico(tecnica, volume) {
        somPool = somPool.filter(s => !s.ended);

        if (somPool.length >= 5) {
            const somMaisAntigo = somPool.shift(); 
            somMaisAntigo.pause();
            somMaisAntigo.currentTime = 0;
        }

        const som = new Audio(`${tecnica}.mp3`);
        som.volume = volume;
        som.play();
        somPool.push(som); 
    }

    async function tocarPartitura() {
        const inputBpmVal = parseInt(document.getElementById('input-bpm').value);
        const bpm = isNaN(inputBpmVal) ? 120 : inputBpmVal;
        const tempoBase = 60 / bpm;
        
        somPool.forEach(s => { s.pause(); s.currentTime = 0; });
        somPool = [];

        for (let i = 0; i < partitura.length; i++) {
            const n = partitura[i];
            
            const valorReal = n.pontuado ? n.valor * 1.5 : n.valor;
            const tempoMs = (tempoBase * valorReal) * 1000;

            if (!n.isPausa) {
                let deveTocar = true;
                if (n.opcional && Math.random() < 0.5) {
                    deveTocar = false;
                }

                if (deveTocar) {
                    try {
                        let forcaFinal = n.forcaOriginal;
                        // CORRIGIDO: Reduzindo -2 para o som abafado ficar muito mais audível!
                        if(n.abafado) {
                            forcaFinal = n.forcaOriginal - 2;
                            if(forcaFinal < 1) forcaFinal = 0.5; 
                        }
                        tocarAudioPolifonico(n.tecnica, forcaFinal / 6);
                    } catch (e) { console.log(e); }
                }
            }

            await new Promise(r => setTimeout(r, tempoMs));
        }
    }

    function baixarImagemOtimizada() {
        if(partitura.length === 0) { alert("Adicione notas primeiro!"); return; }
        
        const areaExport = document.getElementById('export-stave-render');
        areaExport.innerHTML = '';
        areaExport.style.display = 'block';

        const header = document.createElement('div');
        header.style.textAlign = 'center'; header.style.fontWeight = 'bold';
        header.style.fontSize = '20px'; header.style.marginBottom = '20px';
        header.innerText = "ESTÚDIO DE NOTAÇÃO DE BERIMBAU - Partitura Gerada";
        areaExport.appendChild(header);

        let rowDiv = null; let trackDiv = null;
        let staveLinesDiv = null; let somaCompasso = 0;
        let indexLinha = 1;

        function novaLinhaExport() {
            rowDiv = document.createElement('div');
            rowDiv.className = 'export-row';
            
            const leg = document.createElement('div');
            leg.className = 'legend-num';
            leg.style.left = '10px';
            leg.innerHTML = `
                <span style="top: 55px;">5</span>
                <span style="top: 70px;">4</span>
                <span style="top: 85px;">3</span>
                <span style="top: 100px;">2</span>
                <span style="top: 115px;">1</span>
            `;
            rowDiv.appendChild(leg);

            staveLinesDiv = document.createElement('div');
            staveLinesDiv.className = 'stave-lines';
            staveLinesDiv.style.left = '35px';
            staveLinesDiv.style.width = '740px';
            staveLinesDiv.style.top = '40px';
            staveLinesDiv.innerHTML = `<div class="line"></div><div class="line"></div><div class="line"></div>`;
            rowDiv.appendChild(staveLinesDiv);

            trackDiv = document.createElement('div');
            trackDiv.className = 'notes-track';
            trackDiv.style.paddingLeft = '45px';
            rowDiv.appendChild(trackDiv);

            areaExport.appendChild(rowDiv);
            indexLinha++;
        }

        novaLinhaExport();

        for(let i=0; i<partitura.length; i++) {
            const n = partitura[i];
            const divNota = criarElementoNota(n, i, partitura, true);
            trackDiv.appendChild(divNota);

            const valorReal = n.pontuado ? n.valor * 1.5 : n.valor;
            somaCompasso += valorReal;

            if(somaCompasso >= 4 && i !== partitura.length - 1) {
                somaCompasso = 0;
                if(indexLinha % 2 === 0) { 
                    const bar = document.createElement('div');
                    bar.className = 'bar-line';
                    trackDiv.appendChild(bar);
                    novaLinhaExport();
                } else {
                    const bar = document.createElement('div');
                    bar.className = 'bar-line';
                    trackDiv.appendChild(bar);
                }
            }
        }

        const endBar = document.createElement('div');
        endBar.className = 'final-bar-line';
        trackDiv.appendChild(endBar);

        const legendaBlock = document.createElement('div');
        legendaBlock.className = 'export-legend-block';
        legendaBlock.innerHTML = `
            <strong>LEGENDA DE MAPEAMENTO DAS ALTURAS (Pauta de 3 Linhas / 5 Posições):</strong><br>
            Pos 5 (Espaço Superior): ${document.getElementById('map-5').value.toUpperCase()}<br>
            Pos 4 (Linha do Meio): ${document.getElementById('map-4').value.toUpperCase()}<br>
            Pos 3 (Espaço Inferior): ${document.getElementById('map-3').value.toUpperCase()}<br>
            Pos 2 (Linha de Baixo): ${document.getElementById('map-2').value.toUpperCase()}<br>
            Pos 1 (Espaço Abaixo da Pauta): ${document.getElementById('map-1').value.toUpperCase()}<br>
            <small>* Modificadores acumulativos: 'X' no centro = Abafado (-2 Vol) | '()' = Opcional (50% chance) | '.' = Pontuado (+50% tempo).</small>
        `;
        areaExport.appendChild(legendaBlock);

        html2canvas(areaExport, {backgroundColor: '#ffffff'}).then(canvas => {
            let link = document.createElement('a');
            link.download = 'partitura-berimbau-ajustada.png';
            link.href = canvas.toDataURL();
            link.click();
            areaExport.style.display = 'none';
        });
    }

    function salvarPartitura() {
        localStorage.setItem('berimbau_save_v51', JSON.stringify(partitura));
        localStorage.setItem('berimbau_maps_v51', JSON.stringify([
            document.getElementById('map-1').value,
            document.getElementById('map-2').value,
            document.getElementById('map-3').value,
            document.getElementById('map-4').value,
            document.getElementById('map-5').value
        ]));
        alert("Composição e alturas salvas!");
    }

    function carregarPartitura() {
        const dataNotes = localStorage.getItem('berimbau_save_v51');
        const dataMaps = localStorage.getItem('berimbau_maps_v51');
        
        if(dataNotes) { 
            partitura = JSON.parse(dataNotes); 
            if(dataMaps) {
                const maps = JSON.parse(dataMaps);
                for(let i=0; i<5; i++) document.getElementById(`map-${i+1}`).value = maps[i];
            }
            renderizar(); 
        } else { alert("Nenhum registro encontrado."); }
    }

    function limparTudo() {
        partitura = [];
        renderizar();
    }

    renderCabaça('view-cabaca');
</script>
</body>
</html>
