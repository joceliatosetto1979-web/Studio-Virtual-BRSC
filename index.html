<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berimbau SheetMusic Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        :root { --bg: #121212; --panel: #1e1e2e; --accent: #ff9f43; --text: #eee; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; display: flex; flex-direction: column; margin: 0; height: 100vh; }
        
        /* Layout Mobile: Partitura em cima, Controles embaixo */
        #editor-container { flex: 1; padding: 20px; overflow-x: auto; background: #080808; display: flex; align-items: center; }
        #toolbar { background: var(--panel); padding: 15px; overflow-y: auto; max-height: 50vh; border-top: 2px solid #333; }
        
        /* A Partitura (Folha Branca) */
        .sheet-wrapper { background: #fff; color: #000; padding: 40px 20px; border-radius: 8px; position: relative; min-width: 900px; display: inline-block; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }
        .sheet-header { display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 30px; border-bottom: 2px solid #ccc; padding-bottom: 10px; }
        
        /* Linhas da Pauta e Cabaça */
        .pauta-area { position: relative; height: 120px; margin-left: 100px; display: flex; align-items: center; }
        .stave-lines { position: absolute; width: 100%; height: 60px; display: flex; flex-direction: column; justify-content: space-between; z-index: 1; }
        .line { height: 2px; background: #000; width: 100%; }
        
        .cabaca-container { position: absolute; left: -80px; top: 15px; width: 60px; height: 90px; z-index: 2; }
        
        /* Legenda Esquerda (1 a 5) */
        .legend-num { position: absolute; left: -100px; top: 0; height: 100%; display: flex; flex-direction: column; justify-content: space-between; font-weight: bold; font-size: 14px; padding: 10px 0;}
        
        /* Trilho das Notas */
        .notes-track { position: absolute; left: 0; top: 0; display: flex; align-items: flex-start; z-index: 3; height: 100%; }
        
        .note-wrapper { position: relative; display: flex; flex-direction: column; align-items: center; cursor: pointer; width: 45px; margin-right: 5px; }
        .note-wrapper:hover { background: rgba(0,0,0,0.05); }
        .note-svg { width: 40px; height: 90px; overflow: visible; }
        
        /* Barras de Compasso */
        .bar-line { width: 2px; background: #000; height: 60px; margin: 30px 10px 0 10px; }
        .final-bar-line { width: 6px; border-left: 2px solid #000; border-right: 4px solid #000; height: 60px; margin: 30px 10px 0 10px; }
        
        /* UI de Controles */
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn { background: #333; color: white; border: 1px solid #555; padding: 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn.active { background: var(--accent); color: black; border-color: var(--accent); }
        .btn-play { background: #4caf50; color: white; border: none; padding: 15px; font-size: 16px; width: 100%; margin: 10px 0; }
        .btn-action { background: #007bff; color: white; border: none; padding: 10px; width: 100%; margin-top: 5px; }
        
        select, input { padding: 8px; background: #222; color: #fff; border: 1px solid #444; width: 100%; box-sizing: border-box; }
        .config-box { background: #2a2a35; padding: 10px; border-radius: 5px; margin-bottom: 10px; }
        label { font-size: 0.8em; color: #aaa; display: block; margin-bottom: 5px; }
        
        /* Conexão Colcheias (Beam) */
        .beam { position: absolute; background: black; height: 4px; top: 18px; right: -25px; width: 30px; z-index: 4; }
    </style>
</head>
<body>

<svg width="0" height="0" style="display:none;">
    <defs>
        <pattern id="pat-chiado" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <rect width="4" height="8" fill="black" />
            <rect x="4" width="4" height="8" fill="white" />
        </pattern>
        <linearGradient id="pat-soltachiado" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="50%" stop-color="white"/>
            <stop offset="50%" stop-color="black"/>
        </linearGradient>
    </defs>
</svg>

<div id="editor-container">
    <div class="sheet-wrapper" id="partitura-export">
        <div class="sheet-header">
            <span id="lbl-bpm">BPM: 120 (Semínima)</span>
            <span id="lbl-comp">Compasso: 4/4</span>
        </div>
        
        <div class="pauta-area">
            <div class="legend-num">
                <span>5</span><span>4</span><span>3</span><span>2</span><span>1</span>
            </div>
            <div class="cabaca-container" id="view-cabaca"></div>
            
            <div class="stave-lines">
                <div class="line"></div>
                <div class="line"></div>
                <div class="line"></div>
            </div>
            
            <div class="notes-track" id="view-notas"></div>
        </div>
    </div>
</div>

<div id="toolbar">
    <button class="btn-play" onclick="tocarPartitura()">▶ TOCAR PARTITURA</button>

    <div class="config-box">
        <h4>1. Selecione a Duração (Fica salvo)</h4>
        <div class="grid-2" id="btn-valores">
            <button class="btn active" onclick="setValor(1, this)">Semínima (1)</button>
            <button class="btn" onclick="setValor(2, this)">Mínima (2)</button>
            <button class="btn" onclick="setValor(0.5, this)">Colcheia (1/2)</button>
            <button class="btn" onclick="setValor(0.25, this)">Semicolcheia (1/4)</button>
            <button class="btn" onclick="setValor('pausa', this)">Pausa (/)</button>
        </div>
    </div>

    <div class="config-box">
        <h4>2. Toque no Som para Adicionar</h4>
        <div class="grid-2">
            <button class="btn" style="border-left: 5px solid black;" onclick="addNota('presa')">+ Presa</button>
            <button class="btn" style="border-left: 5px solid white;" onclick="addNota('solta')">+ Solta</button>
            <button class="btn" style="border-left: 5px solid gray;" onclick="addNota('chiado')">+ Chiado</button>
            <button class="btn" style="border-left: 5px solid black;" onclick="addNota('acaxixi')">+ Acaxixi</button>
            <button class="btn" style="border-left: 5px solid gray;" onclick="addNota('soltachiado')">+ Solta+Chiado</button>
        </div>
    </div>

    <div class="config-box">
        <h4>Configurar Posições (1 a 5)</h4>
        <div class="grid-2">
            <div><label>Linha 5 (Alta)</label><select id="map-5"><option value="chiado">Chiado</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="acaxixi">Acaxixi</option><option value="soltachiado">Solta+Chiado</option></select></div>
            <div><label>Espaço 4</label><select id="map-4"><option value="soltachiado">Solta+Chiado</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="acaxixi">Acaxixi</option></select></div>
            <div><label>Linha 3 (Meio)</label><select id="map-3"><option value="solta" selected>Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="acaxixi">Acaxixi</option><option value="soltachiado">Solta+Chiado</option></select></div>
            <div><label>Espaço 2</label><select id="map-2"><option value="acaxixi">Acaxixi</option><option value="solta">Solta</option><option value="presa">Presa</option><option value="chiado">Chiado</option><option value="soltachiado">Solta+Chiado</option></select></div>
            <div><label>Linha 1 (Baixa)</label><select id="map-1"><option value="presa" selected>Presa</option><option value="solta">Solta</option><option value="chiado">Chiado</option><option value="acaxixi">Acaxixi</option><option value="soltachiado">Solta+Chiado</option></select></div>
        </div>
    </div>

    <div class="grid-2" style="margin-top: 15px;">
        <button class="btn-action" style="background:#28a745;" onclick="salvarPartitura()">💾 Salvar</button>
        <button class="btn-action" style="background:#17a2b8;" onclick="carregarPartitura()">📂 Carregar</button>
        <button class="btn-action" style="background:#dc3545; grid-column: span 2;" onclick="baixarImagem()">📸 Baixar como Imagem</button>
        <button class="btn-action" style="background:#6c757d; grid-column: span 2;" onclick="limparTudo()">🗑 Limpar Tudo</button>
    </div>
</div>

<script>
    let partitura = [];
    let valorAtual = 1;
    let isPausa = false;

    // Configuração de Cabaça Padrão Gunga para o visual
    function renderCabaça() {
        document.getElementById('view-cabaca').innerHTML = `<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="white" stroke="black" stroke-width="4"/><path d="M50,50 L5,50 A45,45 0 1,1 50,95 Z" fill="black"/></svg>`;
    }

    function setValor(val, btnRef) {
        if (val === 'pausa') { isPausa = true; valorAtual = 1; }
        else { isPausa = false; valorAtual = parseFloat(val); }
        
        document.querySelectorAll('#btn-valores .btn').forEach(b => b.classList.remove('active'));
        btnRef.classList.add('active');
    }

    function getPosicaoByTecnica(tecnica) {
        for(let i=1; i<=5; i++) {
            if(document.getElementById(`map-${i}`).value === tecnica) return `pos-${i}`;
        }
        return 'pos-3'; // Padrão se não achar
    }

    function addNota(tecnica) {
        partitura.push({
            id: Date.now(),
            tecnica: tecnica,
            valor: valorAtual,
            posicao: getPosicaoByTecnica(tecnica),
            isPausa: isPausa
        });
        renderizar();
    }

    function removerNota(id) {
        if(confirm("Deseja apagar esta nota?")) {
            partitura = partitura.filter(n => n.id !== id);
            renderizar();
        }
    }

    function renderizar() {
        const container = document.getElementById('view-notas');
        container.innerHTML = '';
        
        let somaCompasso = 0;
        const compassoMax = 4; // 4 tempos padrão

        for(let i = 0; i < partitura.length; i++) {
            const n = partitura[i];
            
            // Lógica Visual do Preenchimento
            let fill = "white";
            if(n.tecnica === 'presa') fill = "black";
            if(n.tecnica === 'chiado') fill = "url(#pat-chiado)";
            if(n.tecnica === 'soltachiado') fill = "url(#pat-soltachiado)";

            let innerSVG = '';
            
            if (n.isPausa) {
                innerSVG = `<text x="10" y="60" font-size="40" fill="red" font-weight="bold">/</text>`;
            } else {
                // Corpo da nota
                if (n.valor >= 2) {
                    innerSVG += `<ellipse cx="15" cy="70" rx="10" ry="7" fill="${fill}" stroke="black" stroke-width="2"/>`;
                } else {
                    innerSVG += `<ellipse cx="15" cy="70" rx="10" ry="7" fill="${fill}" stroke="black" stroke-width="2"/>`;
                }

                // Detalhe Acaxixi
                if (n.tecnica === 'acaxixi') innerSVG += `<circle cx="15" cy="70" r="4" fill="black"/>`;

                // Haste
                if (n.valor <= 2) innerSVG += `<line x1="25" y1="70" x2="25" y2="10" stroke="black" stroke-width="2"/>`;

                // Conexão (Juntar Colcheias - Simplificado)
                let hasBeam = false;
                if (n.valor <= 0.5 && i < partitura.length - 1 && partitura[i+1].valor <= 0.5 && !partitura[i+1].isPausa) {
                    innerSVG += `<rect x="25" y="10" width="45" height="4" fill="black" />`;
                    hasBeam = true;
                }
                
                // Colchete final se não tiver conexão
                if (n.valor <= 0.5 && !hasBeam) innerSVG += `<path d="M25,10 Q35,20 35,35" fill="none" stroke="black" stroke-width="2"/>`;
                if (n.valor <= 0.25 && !hasBeam) innerSVG += `<path d="M25,20 Q35,30 35,45" fill="none" stroke="black" stroke-width="2"/>`;
            }

            // Margin top baseado na posição (1 a 5)
            let mTop = 0;
            if(n.posicao === 'pos-5') mTop = -10;
            if(n.posicao === 'pos-4') mTop = 5;
            if(n.posicao === 'pos-3') mTop = 20;
            if(n.posicao === 'pos-2') mTop = 35;
            if(n.posicao === 'pos-1') mTop = 50;

            const div = document.createElement('div');
            div.className = `note-wrapper`;
            div.style.marginTop = `${mTop}px`;
            div.onclick = () => removerNota(n.id);
            div.innerHTML = `<svg class="note-svg">${innerSVG}</svg>`;
            container.appendChild(div);

            somaCompasso += n.valor;

            // Fechamento de Compasso (Linha vertical)
            if(somaCompasso >= compassoMax && i !== partitura.length - 1) {
                const bar = document.createElement('div');
                bar.className = 'bar-line';
                container.appendChild(bar);
                somaCompasso = 0;
            }
        }

        // Linha Final da Música
        if(partitura.length > 0) {
            const endBar = document.createElement('div');
            endBar.className = 'final-bar-line';
            container.appendChild(endBar);
        }
    }

    async function tocarPartitura() {
        const bpm = 120;
        const tempoBase = 60 / bpm; 
        
        for (let i = 0; i < partitura.length; i++) {
            const n = partitura[i];
            const tempoMs = (tempoBase * n.valor) * 1000;
            let som = null;

            if (!n.isPausa) {
                try {
                    som = new Audio(`${n.tecnica}.mp3`);
                    som.play();
                } catch (e) {}
            }

            // O SISTEMA ESPERA O TEMPO DA NOTA PASSAR
            await new Promise(r => setTimeout(r, tempoMs));

            // CORTA O ÁUDIO PARA NÃO SOBREPOR NOTAS PEQUENAS (Ex: 1/16)
            if(som) {
                som.pause();
                som.currentTime = 0;
            }
        }
    }

    function salvarPartitura() {
        localStorage.setItem('berimbau_save', JSON.stringify(partitura));
        alert("Salvo com sucesso!");
    }

    function carregarPartitura() {
        const data = localStorage.getItem('berimbau_save');
        if(data) { partitura = JSON.parse(data); renderizar(); }
    }

    function limparTudo() { partitura = []; renderizar(); }

    function baixarImagem() {
        alert("Gerando imagem... Aguarde um instante.");
        html2canvas(document.getElementById("partitura-export")).then(canvas => {
            let link = document.createElement('a');
            link.download = 'minha-partitura.png';
            link.href = canvas.toDataURL();
            link.click();
        });
    }

    renderCabaça();
</script>
</body>
</html>
                                                                                                            </html>
